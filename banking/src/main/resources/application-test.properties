spring.datasource.url=jdbc:h2:mem:banking_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.jwtSecret=test-only-secret-key-for-banking-tests-that-is-at-least-256-bits-long
app.jwtAccessTokenExpiration=900000
app.jwtRefreshTokenExpiration=604800000
